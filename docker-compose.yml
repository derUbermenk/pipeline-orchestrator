# ====================================== AIRFLOW ENVIRONMENT VARIABLES =======================================
x-environment: &airflow_environment
  - AIRFLOW__CORE__EXECUTOR=LocalExecutor
  - AIRFLOW__CORE__LOAD_DEFAULT_CONNECTIONS=False
  - AIRFLOW__CORE__LOAD_EXAMPLES=False
  - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql://airflow:airflow@postgres:5432/airflow
  - AIRFLOW__CORE__STORE_DAG_CODE=True
  - AIRFLOW__CORE__STORE_SERIALIZED_DAGS=True
  - AIRFLOW__WEBSERVER__EXPOSE_CONFIG=True
  - AIRFLOW__CORE__DAGS_FOLDER=/pipeline-orchestrator/dags
  - AIRFLOW_UID=${AIRFLOW_UID:-50000}

x-airflow-base-image: &airflow_base_image apache/airflow:2.9.0-python3.10
# ====================================== /AIRFLOW ENVIRONMENT VARIABLES ======================================

services:
  postgres:
    image: postgres:13
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    ports:
      - "5432:5432"
    volumes:
      - ./data/airflowDB:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  init:
    build:
      context: images/pipeline-orchestrator-base
      args:
        AIRFLOW_BASE_IMAGE: *airflow_base_image
    image: pipeline-orchestrator/airflow
    depends_on:
      postgres:
        condition: service_healthy
    environment: *airflow_environment
    entrypoint: /bin/bash
    command: -c 'airflow db init && airflow users create --username admin --password admin --firstname Anonymous --lastname Admin --role Admin --email admin@example.org'

  webserver:
    image: pipeline-orchestrator/airflow
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    volumes:
      - logs:/opt/airflow/logs
      - ./dags:/pipeline-orchestrator/dags
      - ./projects:/pipeline-orchestrator/projects
      - ~/.kube/config:/home/airflow/.kube/config:ro
    environment: *airflow_environment
    command: webserver

  scheduler:
    image: pipeline-orchestrator/airflow
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    volumes:
      - logs:/opt/airflow/logs
      - ./dags:/pipeline-orchestrator/dags
      - ./projects:/pipeline-orchestrator/projects
      - ~/.kube/config:/home/airflow/.kube/config:ro
    environment: *airflow_environment
    command: scheduler

volumes:
  logs:
