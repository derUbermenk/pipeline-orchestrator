# ====================================== AIRFLOW ENVIRONMENT VARIABLES =======================================
x-environment: &airflow_environment
  - AIRFLOW__CORE__EXECUTOR=LocalExecutor
  - AIRFLOW__CORE__LOAD_DEFAULT_CONNECTIONS=False
  - AIRFLOW__CORE__LOAD_EXAMPLES=False
  - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql://airflow:airflow@postgres:5432/airflow
  - AIRFLOW__CORE__STORE_DAG_CODE=True
  - AIRFLOW__CORE__STORE_SERIALIZED_DAGS=True
  - AIRFLOW__WEBSERVER__EXPOSE_CONFIG=True
  - AIRFLOW__CORE__DAGS_FOLDER=/pipeline-orchestrator/dags
  - AIRFLOW_UID=${AIRFLOW_UID:-50000}
  - AIRFLOW__CORE__AUTH_MANAGER=airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
  - AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS=admin:admin

# ====================================== /AIRFLOW ENVIRONMENT VARIABLES ======================================

services:
  postgres:
    image: postgres:13
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    ports:
      - "5432:5432"
    volumes:
      - ./data/airflowDB:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  init:
    build:
      context: images/pipeline-orchestrator-base
    image: pipeline-orchestrator/airflow
    depends_on:
      postgres:
        condition: service_healthy
    environment: *airflow_environment
    entrypoint: /bin/bash
    command: -c 'airflow db migrate'

  api-server:
    image: pipeline-orchestrator/airflow
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    volumes:
      - logs:/opt/airflow/logs
      - ./dags:/pipeline-orchestrator/dags
      - ./projects:/pipeline-orchestrator/projects
      - ~/.kube/config:/home/airflow/.kube/config:ro
    environment: *airflow_environment
    command: api-server

  scheduler:
    image: pipeline-orchestrator/airflow
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    volumes:
      - logs:/opt/airflow/logs
      - ./dags:/pipeline-orchestrator/dags
      - ./projects:/pipeline-orchestrator/projects
      - ~/.kube/config:/home/airflow/.kube/config:ro
    environment: *airflow_environment
    command: scheduler

  dag-processor:
    image: pipeline-orchestrator/airflow
    environment: *airflow_environment
    volumes:
      - logs:/opt/airflow/logs
      - ./dags:/pipeline-orchestrator/dags
      - ./projects:/pipeline-orchestrator/projects
      - ~/.kube/config:/home/airflow/.kube/config:ro
    command: dag-processor
    depends_on:
      - postgres

volumes:
  logs:
